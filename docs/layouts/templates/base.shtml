<!DOCTYPE html>
<html lang="en">
  <head id="head">
    <meta charset="UTF-8">

      <ctx :if="$page.link().startsWith('/javascript/')">
        <nav class="section-menu" aria-label="JavaScript">
          <p class="section-menu-title">JavaScript</p>
          <a href="$site.page('javascript').link()" class="$page.link().eql($site.page('javascript').link()).then('current', '')">Overview</a>
