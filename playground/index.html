<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yuku playground</title>
    <link rel="stylesheet" href="/style.css" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("yuku-theme") || "dark";
    </script>
    <script>
      const pr = new URLSearchParams(location.search).get("pr")?.match(/^[0-9a-f]{7,40}$/)?.[0];
      const local = !pr && ["localhost", "127.0.0.1"].includes(location.hostname);
      const yuku = local
        ? "/pkg/dist/index.js"
        : pr
          ? `https://esm.sh/pr/yuku-toolchain/yuku/yuku@${pr}`
          : "https://esm.sh/yuku";
      const imports = { yuku };

      const scopes = local ? { "/pkg/": { "#module": "/pkg/dist/module/inline.js" } } : {};
      document.write(`<script type="importmap">${JSON.stringify({ imports, scopes })}<\/script>`);
    </script>
  </head>
  <body>
    <header>
      <div class="brand">yuku<span id="version" class="version"></span></div>
      <div class="opts">
        <label>
          lang
          <select id="lang">
            <option>js</option>
            <option selected>ts</option>
            <option>jsx</option>
            <option>tsx</option>
            <option>dts</option>
          </select>
        </label>
        <label>
          source
          <select id="sourceType">
            <option value="module">module</option>
            <option value="script">script</option>
            <option value="commonjs">commonjs</option>
          </select>
        </label>
        <label><input type="checkbox" id="preserveParens" checked /> preserveParens</label>
        <label><input type="checkbox" id="semanticErrors" /> semanticErrors</label>
        <label><input type="checkbox" id="attachComments" /> attachComments</label>
      </div>
      <button id="theme" class="theme">dark</button>
    </header>
    <main>
      <section class="pane">
        <div class="pane-head">source</div>
        <div id="code" class="view editor" spellcheck="false"></div>
      </section>
      <section class="pane">
        <div class="pane-head">
          <span id="paneTitle">ast</span>
          <div class="opts">
            <select id="view" title="view">
              <option value="ast">ast</option>
              <option value="semantics">semantics</option>
              <option value="tokens">tokens</option>
            </select>
          </div>
        </div>
        <div id="ast" class="view tree"></div>
      </section>
      <section class="pane">
        <div class="pane-head">
          output
          <div class="opts">
            <label title="drop TypeScript-only syntax">
              <input type="checkbox" id="strip" /> strip
            </label>
            <label title="size-reducing syntax rewrites">
              <input type="checkbox" id="minify" /> minify
            </label>
            <select id="format" title="format">
              <option>pretty</option>
              <option>compact</option>
            </select>
            <select id="quotes" title="quotes">
              <option>preserve</option>
              <option>double</option>
              <option>single</option>
              <option>shortest</option>
            </select>
            <select id="comments" title="comments">
              <option>some</option>
              <option>all</option>
              <option>none</option>
              <option>line</option>
              <option>block</option>
            </select>
            <input id="indent" type="number" min="0" max="16" value="2" title="indent" />
          </div>
        </div>
        <pre id="out" class="view"></pre>
      </section>
    </main>
    <section id="problems" hidden>
      <div class="problems-head">
        <span>problems</span>
        <span id="problemsCounts" class="problems-counts"></span>
        <button id="problemsClose" class="problems-close" title="hide problems">✕</button>
      </div>
      <div id="problemsList"></div>
    </section>
    <div id="status" title="toggle problems · F8 next problem, shift+F8 previous">ok</div>
    <div id="diagTip" hidden></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
