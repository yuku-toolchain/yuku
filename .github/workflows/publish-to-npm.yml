name: Publish to NPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write # changelogithub creates the GitHub Release
      id-token: write # OIDC for npm provenance / trusted publishing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned exact: this Node bundles npm 11.16.0. npm 12.0.0 breaks
          # provenance publishing (https://github.com/npm/cli/issues/9722), and every Node 24.x ships
          # npm 11, so pinning here removes the need for an ad-hoc npm install.
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun pm pack` resolves workspace deps from bun.lock, so a lockfile
      # that wasn't regenerated after the version bump would publish packages
      # depending on the previous release (https://github.com/oven-sh/bun/issues/20477).
      - name: Verify lockfile workspace versions
        run: bun .github/scripts/check-lock-versions.ts

      - name: Build
        run: bun run build:npm

      - name: Build wasm
        run: bun run build:wasm

      - name: Generate changelog
        run: bunx changelogithub@14.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages to npm
        run: bun napi-zig publish
