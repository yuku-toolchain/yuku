name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  tools:
    name: Tools tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-tools-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'tools/**/*.zig', 'src/**/*.zig') }}
          restore-keys: |
            zig-tools-${{ runner.os }}-

      - name: Run tools tests
        run: zig build test-tools

  package:
    name: Package for every platform
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-package-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tools/**/*.zig') }}
          restore-keys: |
            zig-package-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the addon for every platform
        run: zig build native

      - name: Build the package
        run: bun run build

      - name: Pack the packages and the smoke test
        run: |
          mkdir -p zig-out/package
          for package in npm/*/; do npm pack "$package" --pack-destination zig-out/package; done
          bun build ./test/runtime/smoke.ts --target=node --packages=external --outfile=zig-out/package/smoke.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: zig-out/package
          if-no-files-found: error

  platforms:
    name: Package on ${{ matrix.platform }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-15 }
          - { platform: darwin-x64, os: macos-15-intel }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: linux-x64, os: ubuntu-24.04 }
          - { platform: win32-arm64, os: windows-11-arm }
          - { platform: win32-x64, os: windows-2025 }
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: app

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - name: Install the package with its addon and WebAssembly
        shell: bash
        run: |
          unpack() {
            mkdir -p "node_modules/$1"
            tar --extract --gzip --file "$2" --strip-components=1 --directory "node_modules/$1"
          }
          unpack yuku yuku-[0-9]*.tgz
          unpack "@yuku-toolchain/$PLATFORM" "yuku-toolchain-$PLATFORM-"[0-9]*.tgz
          unpack @yuku-toolchain/wasm yuku-toolchain-wasm-[0-9]*.tgz
        env:
          PLATFORM: ${{ matrix.platform }}
        working-directory: app

      - name: Run on the addon
        shell: bash
        run: node smoke.mjs | tee smoke.txt && grep --quiet "natively" smoke.txt
        working-directory: app

      - name: Run on the addon with musl
        if: runner.os == 'Linux'
        run: docker run --rm --volume "$PWD:/app" --workdir /app node:24-alpine node smoke.mjs
        working-directory: app

  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'tools/**/*.zig') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Resolve suite revision
        id: suite
        shell: bash
        run: |
          set -euo pipefail
          rev=$(git ls-remote https://github.com/yuku-toolchain/parser-test-suite.git HEAD | cut -f1)
          if [ -z "$rev" ]; then
            echo "could not resolve parser-test-suite HEAD" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache test data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test/parser/suite
            test/projects/*/
          key: test-data-${{ steps.suite.outputs.rev }}-${{ hashFiles('test/parser/load.ts', 'test/projects/*.ts') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load test data
        run: bun run fetch:fixtures

      - name: Zig build
        run: zig build

      - name: Build the package
        run: bun run build

      - name: Zig tests
        run: zig build test

      - name: Parser conformance
        if: ${{ !cancelled() }}
        run: bun run test:parser

      - name: Codegen conformance
        if: ${{ !cancelled() }}
        run: bun run test:codegen

      - name: Analyzer conformance
        if: ${{ !cancelled() }}
        run: bun run test:analyzer

      - name: Sourcemap conformance
        if: ${{ !cancelled() }}
        run: bun run test:sourcemap

      - name: AST tests
        if: ${{ !cancelled() }}
        run: bun run test:ast

      - name: Dialect
        if: ${{ !cancelled() }}
        run: bun run test:dialect

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Runtime floor declarations
        if: ${{ !cancelled() }}
        run: bun .github/scripts/check-engines.ts

      - name: Resolve the minimum runtime
        id: floor
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: echo "version=$(bun -e 'console.log(require("./package.json").engines.node.slice(2))')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          node-version: ${{ steps.floor.outputs.version }}

      - name: Run on the minimum runtime
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: bun run test:runtime
