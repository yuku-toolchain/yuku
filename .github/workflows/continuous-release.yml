name: Continuous Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  publish:
    name: Publish preview packages
    if: github.repository == 'yuku-toolchain/yuku'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native packages
        run: bun run build:npm

      - name: Build wasm packages
        run: bun run build:wasm

      - name: Verify binding artifacts
        run: bun .github/scripts/check-binding-artifacts.ts

      - name: Publish preview packages
        run: |
          bun run pkg-pr-new publish --compact --comment=off \
            --json preview-packages.json \
            './npm/*' \
            './npm/*/@*/binding-*'

      - name: Comment the preview packages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          METADATA_PATH: preview-packages.json
        run: bun .github/scripts/comment-preview-packages.ts
