name: Profile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  native:
    name: Profile the Zig core
    if: github.repository == 'yuku-toolchain/yuku'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC for the CodSpeed upload
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Fetch the corpus
        run: bun fetch:profile

      - name: Build the native profile
        run: zig build profile

      - name: Profile
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          config: profile/codspeed.yml

  package:
    name: Profile the package
    if: github.repository == 'yuku-toolchain/yuku'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC for the CodSpeed upload
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch the corpus
        run: bun fetch:profile

      - name: Build the package
        run: bun run build

      - name: Profile
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: node profile/package.ts
